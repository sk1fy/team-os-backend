syntax = "proto3";

package teamos.events.v1;

import "events/common.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/sk1fy/team-os-backend/contracts/gen/go/events/v1;eventsv1";

enum OrgUserRole {
  ORG_USER_ROLE_UNSPECIFIED = 0;
  ORG_USER_ROLE_OWNER = 1;
  ORG_USER_ROLE_ADMIN = 2;
  ORG_USER_ROLE_EMPLOYEE = 3;
  ORG_USER_ROLE_PARTNER = 4;
}

enum OrgUserStatus {
  ORG_USER_STATUS_UNSPECIFIED = 0;
  ORG_USER_STATUS_ACTIVE = 1;
  ORG_USER_STATUS_INVITED = 2;
  ORG_USER_STATUS_DEACTIVATED = 3;
}

enum OrgEmployeeSection {
  ORG_EMPLOYEE_SECTION_UNSPECIFIED = 0;
  ORG_EMPLOYEE_SECTION_SCHEDULE = 1;
  ORG_EMPLOYEE_SECTION_KNOWLEDGE = 2;
  ORG_EMPLOYEE_SECTION_ACADEMY = 3;
  ORG_EMPLOYEE_SECTION_DISTRIBUTION = 4;
}

enum OrgUserActivationPurpose {
  ORG_USER_ACTIVATION_PURPOSE_UNSPECIFIED = 0;
  ORG_USER_ACTIVATION_PURPOSE_INITIATOR = 1;
  ORG_USER_ACTIVATION_PURPOSE_SECOND_USER = 2;
}

message OrgUserSnapshot {
  string user_id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  OrgUserRole role = 5;
  OrgUserStatus status = 6;
  repeated string position_ids = 7;
  repeated string department_ids = 8;
  repeated OrgEmployeeSection section_access = 9;
  string login = 10;
}

message OrgUserCreatedEvent {
  EventMetadata metadata = 1;
  OrgUserCreatedPayload payload = 2;
}

message OrgUserCreatedPayload {
  OrgUserSnapshot user = 1;
}

message OrgUserUpdatedEvent {
  EventMetadata metadata = 1;
  OrgUserUpdatedPayload payload = 2;
}

message OrgUserUpdatedPayload {
  OrgUserSnapshot user = 1;
  repeated string changed_fields = 2;
}

message OrgUserDeactivatedEvent {
  EventMetadata metadata = 1;
  OrgUserDeactivatedPayload payload = 2;
}

message OrgUserDeactivatedPayload {
  string user_id = 1;
}

message OrgUserDeletedEvent {
  EventMetadata metadata = 1;
  OrgUserDeletedPayload payload = 2;
}

message OrgUserDeletedPayload {
  string user_id = 1;
}

message OrgPositionDeletedEvent {
  EventMetadata metadata = 1;
  OrgPositionDeletedPayload payload = 2;
}

message OrgPositionDeletedPayload {
  string position_id = 1;
  repeated string affected_user_ids = 2;
}

message OrgInviteCreatedEvent {
  EventMetadata metadata = 1;
  OrgInviteCreatedPayload payload = 2;
}

message OrgInviteCreatedPayload {
  string invite_id = 1;
  string token = 2;
  optional string email = 3;
  OrgUserRole role = 4;
  optional string position_id = 5;
  optional string department_id = 6;
  string invited_by_id = 7;
}

// Published under teamos.org.user.activation_created.v1. Raw activation
// tokens are intentionally excluded from the event contract.
message OrgUserActivationCreatedEvent {
  EventMetadata metadata = 1;
  OrgUserActivationCreatedPayload payload = 2;
}

message OrgUserActivationCreatedPayload {
  string activation_id = 1;
  string user_id = 2;
  OrgUserRole role = 3;
  OrgUserActivationPurpose purpose = 4;
  google.protobuf.Timestamp expires_at = 5;
  bool reissued = 6;
}

// Published under teamos.org.user.activated.v1 after password setup succeeds.
message OrgUserActivatedEvent {
  EventMetadata metadata = 1;
  OrgUserActivatedPayload payload = 2;
}

message OrgUserActivatedPayload {
  OrgUserSnapshot user = 1;
  google.protobuf.Timestamp activated_at = 2;
}
