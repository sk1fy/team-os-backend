syntax = "proto3";

package teamos.events.v1;

import "events/common.proto";

option go_package = "github.com/sk1fy/team-os-backend/contracts/gen/go/events/v1;eventsv1";

// Retired: retained only for protobuf compatibility. New company registrations
// use company registration tokens and ordinary password sessions; this event is
// no longer published.
message AuthSsoLoginEvent {
  EventMetadata metadata = 1;
  AuthSsoLoginPayload payload = 2;
}

message AuthSsoLoginPayload {
  string user_id = 1;
  string provider = 2;
  string external_account_id = 3;
  string external_user_id = 4;
  string session_id = 5;
}
