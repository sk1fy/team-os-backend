syntax = "proto3";

package teamos.events.v1;

import "events/common.proto";

option go_package = "github.com/sk1fy/team-os-backend/contracts/gen/go/events/v1;eventsv1";

// Published under teamos.company.company.created.v1 after the company owner
// and the company record have been committed to the company-service outbox.
message CompanyCreatedEvent {
  EventMetadata metadata = 1;
  CompanyCreatedPayload payload = 2;
}

message CompanyCreatedPayload {
  string company_id = 1;
  string name = 2;
  string owner_user_id = 3;
}

// Published under teamos.company.company.provisioned.v1 after the company,
// integration and both bootstrap users are committed atomically.
message CompanyProvisionedEvent {
  EventMetadata metadata = 1;
  CompanyProvisionedPayload payload = 2;
}

message CompanyProvisionedPayload {
  string company_id = 1;
  string name = 2;
  string provider = 3;
  string external_account_id = 4;
  string owner_user_id = 5;
  string admin_user_id = 6;
  string initiator_user_id = 7;
}

// Published under teamos.company.onboarding.completed.v1 once both bootstrap
// users have active password credentials.
message CompanyOnboardingCompletedEvent {
  EventMetadata metadata = 1;
  CompanyOnboardingCompletedPayload payload = 2;
}

message CompanyOnboardingCompletedPayload {
  string company_id = 1;
  string owner_user_id = 2;
  string admin_user_id = 3;
}
