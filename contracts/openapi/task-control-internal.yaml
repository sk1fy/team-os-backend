openapi: 3.1.0
info:
  title: 'Контроль задач: прямой runtime TeamOS и инфраструктурный Core'
  version: 1.3.0
  description: Core проверяет JWT amoCRM и live CRM роль, выдаёт signed assertion и хранит установку/мониторинг. Runtime session/bootstrap
    и runtime v2 bootstrap/ACK реализованы в teamos.yaml; правила выдаёт напрямую backend TeamOS.
    Динамический intent и resolver v2 реализованы в company (КТ-01.R11); расширенный monitoring относится к R07.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://teamos.example.invalid
security:
- runtimeSession: []
