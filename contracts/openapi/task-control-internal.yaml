  /internal/task-control/accounts/{accountId}/references:
    get:
      operationId: readTaskControlCRMReferences
      summary: Complete scoped CRM references from the shared Core provider
      description: Requires separate task-control.references.read capability (default disabled). No query/body. HMAC signs exact URI with existing headers. Complete source <=4 MiB, deadline 30 seconds, TTL 300 seconds from fetchStartedAt. Revalidates grant and generation before and after cache/read. Does not require Distribution.
      x-owner: Core
      security:
      - signedService: []
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema:
                $ref: ./teamos.yaml#/components/schemas/CRMReferenceSnapshot
        '400':
          description: Ошибка без изменения правил
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
