# Include inside the TeamOS API HTTPS server block, alongside its /api proxy.
# Exact locations take precedence over broad /api/ prefix proxies.
location = /api/v1/public/amocrm/admin-self-login {
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    return 403 '{"error":{"message":"Вход по данным браузера отключён","status":403,"code":"AMO_BROWSER_ENTRY_DISABLED"}}';
}
location = /api/v1/public/amocrm/company-bootstrap {
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    return 403 '{"error":{"message":"Вход по данным браузера отключён","status":403,"code":"AMO_BROWSER_ENTRY_DISABLED"}}';
}
location ^~ /api/v1/public/amocrm/admin-self-login/ {
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    return 403 '{"error":{"message":"Вход по данным браузера отключён","status":403,"code":"AMO_BROWSER_ENTRY_DISABLED"}}';
}
location ^~ /api/v1/public/amocrm/company-bootstrap/ {
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    return 403 '{"error":{"message":"Вход по данным браузера отключён","status":403,"code":"AMO_BROWSER_ENTRY_DISABLED"}}';
}
